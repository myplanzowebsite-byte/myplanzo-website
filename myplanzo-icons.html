<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MyPlanzo Icon Set</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #07070F;
      font-family: system-ui, -apple-system, sans-serif;
      color: #fff;
      padding: 44px 20px 64px;
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 48px; }

    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(90deg,#00B8FF18,#00B8FF08);
      border: 1px solid #00B8FF30; border-radius: 999px;
      padding: 5px 18px; margin-bottom: 18px;
      font-size: 10px; letter-spacing: 2.5px; text-transform: uppercase; color: #00B8FF;
    }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: #00B8FF; display: inline-block; }

    h1 {
      font-size: clamp(22px,5vw,42px); font-weight: 800; margin-bottom: 10px;
      background: linear-gradient(135deg,#fff 30%,#00B8FF 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -1px; line-height: 1.1;
    }
    .subtitle { color: #333355; font-size: 13px; margin-bottom: 28px; }

    /* ── Size picker ── */
    .size-picker {
      display: inline-flex; gap: 4px; background: #10101A;
      border-radius: 12px; padding: 4px; border: 1px solid #1A1A2E;
    }
    .size-btn {
      padding: 6px 14px; border-radius: 8px; border: none;
      font-size: 11px; font-weight: 700; cursor: pointer;
      background: transparent; color: #333355;
      transition: all 0.15s;
    }
    .size-btn.active {
      background: linear-gradient(135deg,#00B8FF,#0077B6);
      color: #fff;
    }

    /* ── Grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px; max-width: 880px; margin: 0 auto 52px;
    }

    .card {
      position: relative; overflow: hidden;
      background: #0B0B18;
      border: 1px solid #13132A;
      border-radius: 18px;
      padding: 26px 12px 18px;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      cursor: default;
      transition: transform 0.22s cubic-bezier(.4,0,.2,1),
                  box-shadow 0.22s cubic-bezier(.4,0,.2,1),
                  background 0.22s, border-color 0.22s;
    }
    .card:hover { transform: translateY(-5px) scale(1.03); background: #0C1120; }

    .glow {
      position: absolute; top: 8px; left: 50%;
      transform: translateX(-50%);
      width: 96px; height: 96px; border-radius: 50%;
      pointer-events: none; opacity: 0;
      transition: opacity 0.22s;
    }
    .card:hover .glow { opacity: 1; }

    .bar {
      position: absolute; bottom: 0; left: 15%; right: 15%;
      height: 2px; border-radius: 2px;
      opacity: 0; transition: opacity 0.22s;
    }
    .card:hover .bar { opacity: 1; }

    .icon-wrap { position: relative; z-index: 1; display: flex; }

    .label {
      font-size: 10px; font-weight: 700;
      color: #2A2A4A;
      text-align: center; letter-spacing: 0.5px;
      text-transform: uppercase; line-height: 1.3;
      transition: color 0.2s;
    }

    /* ── Palette strip ── */
    .palette {
      max-width: 880px; margin: 0 auto;
      background: #0B0B18; border: 1px solid #13132A;
      border-radius: 18px; padding: 24px 28px;
    }
    .palette-title {
      font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
      color: #00B8FF; margin-bottom: 18px; font-weight: 700;
    }
    .palette-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 14px;
    }
    .palette-item { display: flex; align-items: center; gap: 10px; }
    .swatch {
      width: 26px; height: 26px; border-radius: 8px;
      flex-shrink: 0;
    }
    .swatch-label { font-size: 11px; color: #2A2A4A; line-height: 1.3; }

    footer { text-align: center; color: #13132A; font-size: 11px; margin-top: 24px; }
  </style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">

let currentSize = 56;

function buildGrid() {
  const grid = document.getElementById('iconGrid');
  grid.innerHTML = '';
  ICONS.forEach(icon => {
    const card = document.createElement('div');
    card.className = 'card';

    const glow = document.createElement('div');
    glow.className = 'glow';
    glow.style.background = `radial-gradient(circle, ${icon.accent}28 0%, transparent 70%)`;

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.background = `linear-gradient(90deg, transparent, ${icon.accent}, transparent)`;

    const wrap = document.createElement('div');
    wrap.className = 'icon-wrap';
    wrap.innerHTML = icon.svg;
    const svgEl = wrap.querySelector('svg');
    svgEl.setAttribute('width', currentSize);
    svgEl.setAttribute('height', currentSize);

    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = icon.name;

    card.addEventListener('mouseenter', () => {
      card.style.borderColor = icon.accent + '55';
      card.style.boxShadow = `0 16px 48px ${icon.accent}20, 0 4px 16px rgba(0,0,0,0.5)`;
      label.style.color = icon.accent;
    });
    card.addEventListener('mouseleave', () => {
      card.style.borderColor = '#13132A';
      card.style.boxShadow = '0 2px 8px rgba(0,0,0,0.35)';
      label.style.color = '#2A2A4A';
    });

    card.appendChild(glow);
    card.appendChild(bar);
    card.appendChild(wrap);
    card.appendChild(label);
    grid.appendChild(card);
  });
}

function buildPalette() {
  const pg = document.getElementById('paletteGrid');
  ICONS.forEach(icon => {
    const item = document.createElement('div');
    item.className = 'palette-item';
    const swatch = document.createElement('div');
    swatch.className = 'swatch';
    swatch.style.background = icon.accent;
    swatch.style.boxShadow = `0 0 10px ${icon.accent}60`;
    const lbl = document.createElement('span');
    lbl.className = 'swatch-label';
    lbl.textContent = icon.name;
    item.appendChild(swatch);
    item.appendChild(lbl);
    pg.appendChild(item);
  });
}

function updateSize(size) {
  currentSize = size;
  document.querySelectorAll('.icon-wrap svg').forEach(svg => {
    svg.setAttribute('width', size);
    svg.setAttribute('height', size);
  });
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.classList.toggle('active', parseInt(btn.dataset.size) === size);
  });
}

document.getElementById('sizePicker').addEventListener('click', e => {
  if (e.target.dataset.size) updateSize(parseInt(e.target.dataset.size));
});

buildGrid();
buildPalette();
</script>
